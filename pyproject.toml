[project]
name = "Abyss"
version = "0.2.3"
description = "A modular command-line playground"
readme = "README.md"
requires-python = ">= 3.12"
license = "MIT"
authors = [{ name = "inkitten", email = "mehdi.bahadoran@proton.me" }]
urls = { Homepage = "https://github.com/inkitten/Abyss..My-operating-environment" }
dependencies = ["rich", "toml"]

[project.scripts]
Abyss = "core.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["core"]
